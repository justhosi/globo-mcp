    <style>
    /* By default, hide features for javascript-disabled browsing */
    /* We use !important to override any css with higher specificity */
    /* It is also overriden by the styles in <noscript> in the header file */
    .no-js {
      clip: rect(0 0 0 0);

      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: 1px;

        overflow: auto;
        position: static;
        white-space: normal;
        width: 100%;

  <style>
    .or-seperator{
      width: 100%;
      display: flex;
      flex-direction: row;
      text-transform: uppercase;
      border: none;
      font-size: 12px;
      font-weight: 500;
      margin: 0;
      padding: 24px 0 0;
      padding: var(--spacing-3) 0 0 0;
    }

    .or-seperator span {
      text-align: center;
      flex: 0.2 0 auto;
      margin: 0;
    }

    .or-seperator:after, .or-seperator:before {
      content: "";
      border-bottom: 1px solid #c2c8d0;
      border-bottom: 1px solid var(--border-default-color);
      flex: 1 0 auto;
      height: 0.5em;
      margin: 0;
    }



    .scheduled-call-btn {
      display: flex;
      position: relative;
      padding: 0 8px 0 52px;
      padding: 0 var(--spacing-1) 0 var(--spacing-6-5);
      background: #fff;
      background: var(--widget-background-color);
      align-items: center;
      width: 100%;
      font-size: 16px;
      font-size: var(--lg-font-size);
      font-family: inherit;
      height: 52px;
      height: var(--button-height);
      border: 1px solid #c2c8d0;
      border: var(--social-button-border-width) solid var(--social-button-border-color);
      border-radius: 3px;
      border-radius: var(--button-border-radius);
      color: #2d333a;
      color: var(--secondary-button-text-color);
      cursor: pointer;
      outline: 0;
      transition: box-shadow .15s ease-in-out,background-color .15s ease-in-out;
      transition: box-shadow var(--transition-speed) var(--transition-easing),background-color var(--transition-speed) var(--transition-easing);
    }


    .scheduled-call-btn:hover {
      box-shadow: inset 0 0 0 150px rgb(0 0 0 / 10%);
      box-shadow: var(--button-hover-shadow);
    }

<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function (event) {
    Element.prototype.remove = function () {
      this.parentElement.removeChild(this);
    }
    NodeList.prototype.remove = HTMLCollection.prototype.remove = function () {
      for (var i = this.length - 1; i >= 0; i--) {
        if (this[i] && this[i].parentElement) {
          this[i].parentElement.removeChild(this[i]);
        }
      }
    }
    var xpath = "//a[contains(@href,'signup')]";
    var signUpLink = document.evaluate(xpath, document, null, XPathResult.FIRST_ORDERED_NODE_TYPE, null).singleNodeValue;
    if (signUpLink) {
      signUpLink.parentElement.remove();
    }

    
    
    var xpath2 = "(//button[@type='submit'])[last()]";
    var continueButton = document.evaluate(xpath2, document, null, XPathResult.FIRST_ORDERED_NODE_TYPE, null).singleNodeValue;
    if(continueButton){

      var orContainer = document.createElement("div");
      orContainer.className = 'or-seperator';
      var orSpan = document.createElement("span");
      orSpan.innerText = "Or";

      orContainer.appendChild(orSpan);

      var scheduledCallsContainer = document.createElement("div");
      scheduledCallsContainer.style = 'padding-top: 12px;';
      var btn = document.createElement("a");
      btn.href = 'https://globohq.com/join';
      btn.innerText = 'Join Scheduled Call';
      btn.className = 'scheduled-call-btn';
      btn.style = 'padding: 0; display: flex; align-items: center; justify-content: center;';
      scheduledCallsContainer.appendChild(btn);
      continueButton.parentElement.after(orContainer, scheduledCallsContainer);
    }
    
    
  });
</script>
</body>
</html>
